name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows too: a file handle that is left open only fails there.
        os: [ubuntu-latest, windows-latest]

    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true
    - run: go version

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

    # A directory that starts with an underscore is not part of "./...".
    # An example with a go.mod is a module of its own, the rest belong to
    # the root module.
    - name: Build the examples
      shell: bash
      run: |
        out="$(mktemp -d)"
        for dir in _examples/*/; do
          echo "::group::${dir}"
          if [ -f "${dir}go.mod" ]; then
            (cd "${dir}" && go vet ./... && go build -o "${out}/" ./... && go test -race ./...)
          else
            go vet "./${dir}" && go build -o "${out}/" "./${dir}"
          fi
          echo "::endgroup::"
        done
